# Jekyll + Just the Docs Configuration

# Site settings
title: 종인의 기술 블로그
description: Jongin's Tech Blog - Java, Spring, JavaScript 개발 블로그
# Base URL helps with GitHub Pages deployment
# Uncomment and adjust if needed:
# baseurl: ""

# URL settings
url: https://kji6252.github.io

# Just the Docs theme settings
theme: just-the-docs

# Set the theme color scheme
color_scheme: light

# Enable or disable the site search
search_enabled: true

# Search configuration
search:
  # Split pages into sections that can be searched individually
  heading_level: 2
  # Maximum amount of previews per search result
  previews: 3
  # Maximum amount of words to display before a matched word in preview
  preview_words_before: 5
  # Maximum amount of words to display after a matched word in preview
  preview_words_after: 10
  # Display relative url in search results
  rel_url: true
  # Enable or disable the search button
  button: false

# Aux links for upper right navigation
aux_links:
  "GitHub":
    - "https://github.com/kji6252"
  "Portfolio":
    - "/portfolio/"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Heading anchor links appear on hover over h1-h6 tags
heading_anchors: true

# Footer content
footer_content: "Copyright &copy; 2024 Jongin Kim. Distributed by an <a href=\"https://github.com/kji6252/kji6252.github.io/blob/master/LICENSE\">MIT license.</a>"

# Footer last edited timestamp
last_edit_timestamp: true
last_edit_time_format: "%Y-%m-%d %H:%M"

# Footer "Edit this page on GitHub" link
gh_edit_link: true
gh_edit_link_text: "페이지 수정하기"
gh_edit_repository: "https://github.com/kji6252/kji6252.github.io"
gh_edit_branch: "jekyll-migration"
gh_edit_view_mode: "tree"

# Navigation sidebar
nav_sort: case_insensitive

# Collections for posts
collections:
  posts:
    permalink: /:categories/:title/
    output: true
  docs:
    permalink: /:collection/:path/
    output: true
  redis_patterns:
    permalink: /:collection/:path/
    output: true

# Default layout for pages
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: "docs"
      type: "docs"
    values:
      layout: "default"
  - scope:
      path: "redis_patterns"
      type: "redis_patterns"
    values:
      layout: "default"

# Just the Docs collections configuration
just_the_docs:
  collections:
    posts:
      name: 블로그 포스트
      child_nav_order: reversed
    docs:
      name: Claude & Obsidian 가이드
    redis_patterns:
      name: Redis Design Patterns

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Markdown processor
markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from processing
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - LICENSE
  - package.json
  - package-lock.json
  - yarn.lock
  - _config.yml
  - scaffolds/
  - source/
  - themes/
  - .idea/
  - .gitignore
  - docs/Claude-Obsidian-Guide/Templates/

# Build settings
timezone: Asia/Seoul
future: true
