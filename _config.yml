# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

# The language of the webpage
lang: ko-KR

# Change to your timezone
timezone: Asia/Seoul

# jekyll-seo-tag settings
title: 종인의 기술 블로그

tagline: Jongin's Tech Blog

description: >-
  Java, Spring, JavaScript 개발 블로그 - Jongin's Tech Blog

# Fill in the protocol & hostname for your site
url: "https://pallidev.github.io"

github:
  username: pallidev

social:
  name: Jongin Kim
  links:
    - https://github.com/pallidev

# Web Analytics Settings
analytics:
  google:
    id: # fill in your Google Analytics ID

# Prefer color scheme setting.
# Available options:
#     light — Use the light color scheme
#     dark — Use the dark color scheme
#     (empty) — Follow the system preference with toggle
theme_mode:

# The avatar on sidebar
avatar: "/images/avatar.jpg"

# The URL of the site-wide social preview image used in SEO `og:image` meta tag
social_preview_image:

# Global TOC switch for posts
toc: true

# Comments
comments:
  provider:

# PWA
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order
  docs:
    output: true
    permalink: /:collection/:path/
  redis_patterns:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /:categories/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
      type: docs
    values:
      layout: page
  - scope:
      path: ""
      type: redis_patterns
    values:
      layout: page

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock
  - vendor/
  - CLAUDE.md
  - scaffolds/
  - source/
  - themes/
  - .idea/
  - docs/Claude-Obsidian-Guide/Templates/

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

future: true
